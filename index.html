<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Legacy Protocol - Global Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body class="text-slate-200">

    <div id="canvas-container"></div>

    <div class="ui-layer flex flex-col justify-between h-screen p-6">
        <header class="flex justify-between items-start">
            <div class="bg-slate-900/80 backdrop-blur border border-emerald-500/30 p-4 rounded shadow-2xl">
                <h1 class="text-emerald-400 font-bold tracking-widest text-lg">AEGIS LEGACY PROTOCOL</h1>
                <p class="text-xs text-slate-400 mt-1">Status: <span class="text-emerald-400 animate-pulse">● OPERATIONAL</span></p>
            </div>
            <div class="bg-slate-900/80 backdrop-blur border border-slate-700 p-3 rounded text-right text-xs">
                <p id="clock">SYSTEM TIME: LOADING...</p>
                <p class="text-slate-500 mt-1">NODE: SECURE ROOT</p>
            </div>
        </header>

        <main class="flex justify-between items-end mt-auto">
            <div class="bg-slate-900/80 backdrop-blur border border-slate-700/50 p-4 rounded w-80 text-xs space-y-2">
                <div class="text-emerald-400 font-bold border-b border-slate-700 pb-1 mb-2">TELEMETRY STREAMS</div>
                <div class="flex justify-between"><span>Spam Shield Core:</span><span class="text-emerald-400">ONLINE</span></div>
                <div class="flex justify-between"><span>Proof of Reality:</span><span class="text-cyan-400">STANDBY</span></div>
                <div class="flex justify-between"><span>AI Integration:</span><span class="text-emerald-400">CONNECTED</span></div>
                <div class="flex justify-between"><span>Local Database Size:</span><span class="text-slate-400">10,007 BITS</span></div>
            </div>

            <div class="interactive bg-slate-900/90 border border-emerald-500/20 px-4 py-2 rounded text-xs text-center text-slate-400 max-w-sm">
                Drag on screen to rotate the network globe visualization.
            </div>
        </main>
    </div>

    <script>
        // System Clock Functionality
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = `SYSTEM TIME: ${now.toISOString().replace('T', ' ').substring(0, 19)} UTC`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- THREE.JS 3D INTERACTIVE GLOBE GENERATOR ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Create Earth Sphere Geometry
        const geometry = new THREE.SphereGeometry(0.6, 64, 64);
        
        // Wireframe layout to visualize data meshes instead of flat texture maps
        const material = new THREE.MeshBasicMaterial({
            color: 0x10b981,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const earthMesh = new THREE.Mesh(geometry, material);
        scene.add(earthMesh);

        // Add secondary internal particle aura data node layout
        const dotGeometry = new THREE.SphereGeometry(0.595, 32, 32);
        const dotMaterial = new THREE.PointsMaterial({
            color: 0x34d399,
            size: 0.006,
            transparent: true,
            opacity: 0.8
        });
        const dotMesh = new THREE.Points(dotGeometry, dotMaterial);
        scene.add(dotMesh);

        // Add glowing target tracking coordinates
        const markerGeometry = new THREE.BufferGeometry();
        const markerCount = 15;
        const positions = new Float32Array(markerCount * 3);
        
        for(let i=0; i<markerCount*3; i+=3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 0.605;
            
            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);
        }
        
        markerGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const markerMaterial = new THREE.PointsMaterial({
            color: 0x22d3ee,
            size: 0.025,
            transparent: true,
            opacity: 0.9
        });
        const markers = new THREE.Points(markerGeometry, markerMaterial);
        scene.add(markers);

        // Handle Interactive Mouse/Touch Drag Control Mechanics
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => { isDragging = true; });
        window.addEventListener('touchstart', (e) => { isDragging = true; previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });

        window.addEventListener('mousemove', (e) => {
            const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
            if (isDragging) {
                earthMesh.rotation.y += deltaMove.x * 0.005;
                earthMesh.rotation.x += deltaMove.y * 0.005;
                dotMesh.rotation.y += deltaMove.x * 0.005;
                dotMesh.rotation.x += deltaMove.y * 0.005;
                markers.rotation.y += deltaMove.x * 0.005;
                markers.rotation.x += deltaMove.y * 0.005;
            }
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('touchmove', (e) => {
            const deltaMove = { x: e.touches[0].clientX - previousMousePosition.x, y: e.touches[0].clientY - previousMousePosition.y };
            if (isDragging) {
                earthMesh.rotation.y += deltaMove.x * 0.008;
                earthMesh.rotation.x += deltaMove.y * 0.008;
                dotMesh.rotation.y += deltaMove.x * 0.008;
                dotMesh.rotation.x += deltaMove.y * 0.008;
                markers.rotation.y += deltaMove.x * 0.008;
                markers.rotation.x += deltaMove.y * 0.008;
            }
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('touchend', () => { isDragging = false; });

        // Handle resizing layout changes
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if(!isDragging) {
                earthMesh.rotation.y += 0.001;
                dotMesh.rotation.y += 0.0012;
                markers.rotation.y += 0.001;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
