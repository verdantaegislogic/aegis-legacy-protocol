<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Legacy Protocol - Truth Engine</title>
    <meta name="description" content="Official repository for the Aegis Legacy Protocol Truth Engine.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff41;
            padding: 20px;
            min-height: 100vh;
        }
        
        #app {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff41;
            text-align: center;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        #globeContainer {
            border: 2px solid #00ff41;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
            height: 500px;
        }
        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        
        .panel {
            border: 2px solid #00ff41;
            padding: 20px;
            background: rgba(0, 255, 65, 0.05);
        }
        
        .status {
            margin: 15px 0;
            padding: 10px;
            border-left: 3px solid #00ff41;
            padding-left: 15px;
        }
        
        .alert {
            color: #ff3333;
            border-left-color: #ff3333;
        }
        
        .success {
            color: #00ff41;
            border-left-color: #00ff41;
        }
        
        .console-output {
            background: #000;
            border: 1px solid #00ff41;
            padding: 10px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .console-output div {
            margin: 2px 0;
        }
        
        .log-info {
            color: #00ff41;
        }
        
        .log-error {
            color: #ff3333;
        }
        
        .log-warn {
            color: #ffaa00;
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            #globeContainer {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>⚡ Aegis Legacy Protocol - Truth Engine</h1>
        
        <div class="container">
            <!-- 3D Globe Container -->
            <div id="globeContainer">
                <canvas id="globeCanvas"></canvas>
            </div>
            
            <!-- Control Panel -->
            <div class="panel">
                <h2>System Status</h2>
                <div id="status-content">
                    <div class="status">
                        <strong>🔄 Initializing Reality Verification System...</strong>
                    </div>
                </div>
                <div class="console-output" id="console-output"></div>
            </div>
        </div>
    </div>
    
    <!-- Three.js Library (Required for 3D Globe) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    
    <!-- Aegis Protocol Scripts -->
    <script src="proof-of-reality.js" defer></script>
    <script src="ai-integration.js" defer></script>
    
    <!-- Initialization & Globe Setup -->
    <script defer>
        // Logger utility
        const AegisLogger = {
            logs: [],
            
            log: function(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                this.logs.push({ message: logEntry, type });
                this.render();
                console.log(logEntry);
            },
            
            render: function() {
                const output = document.getElementById('console-output');
                if (output) {
                    output.innerHTML = this.logs
                        .map(log => `<div class="log-${log.type}">${log.message}</div>`)
                        .join('');
                    output.scrollTop = output.scrollHeight;
                }
            }
        };
        
        // Three.js Globe Renderer
        const AegisGlobe = {
            scene: null,
            camera: null,
            renderer: null,
            globe: null,
            initialized: false,
            
            init: function() {
                try {
                    const container = document.getElementById('globeContainer');
                    if (!container || this.initialized) return;
                    
                    AegisLogger.log('Initializing Three.js Scene...', 'info');
                    
                    // Scene Setup
                    this.scene = new THREE.Scene();
                    this.scene.background = new THREE.Color(0x0a0e27);
                    
                    // Camera Setup
                    const width = container.clientWidth;
                    const height = container.clientHeight;
                    this.camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                    this.camera.position.z = 2;
                    
                    // Renderer Setup
                    const canvas = document.getElementById('globeCanvas');
                    this.renderer = new THREE.WebGLRenderer({ 
                        canvas: canvas, 
                        antialias: true,
                        alpha: true 
                    });
                    this.renderer.setSize(width, height);
                    this.renderer.setPixelRatio(window.devicePixelRatio);
                    
                    AegisLogger.log('Three.js Renderer Initialized', 'info');
                    
                    // Create Globe
                    this.createGlobe();
                    
                    // Add Lighting
                    const light = new THREE.PointLight(0x00ff41, 1, 100);
                    light.position.set(5, 5, 5);
                    this.scene.add(light);
                    
                    const ambientLight = new THREE.AmbientLight(0x404040);
                    this.scene.add(ambientLight);
                    
                    AegisLogger.log('Lighting System Activated', 'info');
                    
                    // Animation Loop
                    this.animate();
                    
                    // Handle Window Resize
                    window.addEventListener('resize', () => this.onWindowResize());
                    
                    this.initialized = true;
                    AegisLogger.log('3D Globe Initialization Complete', 'info');
                    
                } catch (error) {
                    AegisLogger.log(`Globe Initialization Error: ${error.message}`, 'error');
                }
            },
            
            createGlobe: function() {
                try {
                    // Create sphere geometry for globe
                    const geometry = new THREE.IcosahedronGeometry(1, 32);
                    
                    // Create material with cyan glow
                    const material = new THREE.MeshStandardMaterial({
                        color: 0x00ff41,
                        emissive: 0x00ff41,
                        emissiveIntensity: 0.3,
                        metalness: 0.7,
                        roughness: 0.2
                    });
                    
                    this.globe = new THREE.Mesh(geometry, material);
                    this.scene.add(this.globe);
                    
                    // Create wireframe overlay
                    const wireframeGeometry = new THREE.IcosahedronGeometry(1.01, 32);
                    const wireframeMaterial = new THREE.MeshBasicMaterial({
                        wireframe: true,
                        color: 0x00ff41,
                        transparent: true,
                        opacity: 0.3
                    });
                    const wireframe = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
                    this.scene.add(wireframe);
                    
                    AegisLogger.log('3D Globe Mesh Created', 'info');
                    
                } catch (error) {
                    AegisLogger.log(`Globe Creation Error: ${error.message}`, 'error');
                }
            },
            
            animate: function() {
                requestAnimationFrame(() => this.animate());
                
                if (this.globe) {
                    this.globe.rotation.x += 0.0005;
                    this.globe.rotation.y += 0.001;
                }
                
                this.renderer.render(this.scene, this.camera);
            },
            
            onWindowResize: function() {
                const container = document.getElementById('globeContainer');
                if (!container || !this.camera || !this.renderer) return;
                
                const width = container.clientWidth;
                const height = container.clientHeight;
                
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }
        };
        
        // Main Initialization Function
        function initializeAegis() {
            try {
                AegisLogger.log('=== Aegis Legacy Protocol Startup ===', 'info');
                AegisLogger.log('System Initializing...', 'info');
                
                // Initialize Globe
                setTimeout(() => AegisGlobe.init(), 100);
                
                // Run Truth Engine
                setTimeout(() => {
                    if (typeof aegisProtocol !== 'undefined') {
                        AegisLogger.log('Truth Engine Online', 'info');
                        const result = aegisProtocol.verifyReality({ source: "Live Feed", isTampered: false });
                        AegisLogger.log(result, 'info');
                        
                        // Update Status Panel
                        const statusContent = document.getElementById('status-content');
                        if (statusContent) {
                            statusContent.innerHTML = `
                                <div class="status success">
                                    <strong>✓ Reality Verification Complete</strong><br>
                                    Status: Data Authenticity Confirmed<br>
                                    Protocol: Aegis Legacy ${new Date().toLocaleTimeString()}
                                </div>
                            `;
                        }
                    }
                }, 500);
                
                // Log AI Integration
                setTimeout(() => {
                    if (typeof aegisAI !== 'undefined') {
                        AegisLogger.log(`AI Integration Ready: ${aegisAI.model}`, 'info');
                    }
                }, 700);
                
                // Log Agents
                setTimeout(() => {
                    AegisLogger.log('Agent Status:', 'info');
                    if (typeof aegisProtocol !== 'undefined') {
                        AegisLogger.log(`  • Vigil: ${aegisProtocol.agents.vigil}`, 'warn');
                        AegisLogger.log(`  • Validator: ${aegisProtocol.agents.validator}`, 'warn');
                        AegisLogger.log(`  • Executive: ${aegisProtocol.agents.executive}`, 'warn');
                    }
                }, 900);
                
                AegisLogger.log('=== Startup Complete ===', 'info');
                
            } catch (error) {
                AegisLogger.log(`Initialization Error: ${error.message}`, 'error');
            }
        }
        
        // Wait for DOM and Three.js to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof THREE !== 'undefined') {
                    initializeAegis();
                } else {
                    // Retry if Three.js isn't loaded yet
                    setTimeout(initializeAegis, 500);
                }
            });
        } else {
            if (typeof THREE !== 'undefined') {
                initializeAegis();
            } else {
                setTimeout(initializeAegis, 500);
            }
        }
    </script>
</body>
</html>
