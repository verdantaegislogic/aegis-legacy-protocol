<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Legacy Protocol - Truth Engine</title>
    <meta name="description" content="Official repository for the Aegis Legacy Protocol Truth Engine.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff41;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #app {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            margin: 20px auto 0;
            text-shadow: 0 0 10px #00ff41;
            text-align: center;
            font-size: 18px;
            pointer-events: auto;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            margin-top: 0;
            flex: 1;
            pointer-events: none;
        }
        
        .panel {
            border: 2px solid #00ff41;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            max-height: 500px;
            pointer-events: auto;
            overflow-y: auto;
        }
        
        .panel h2 {
            font-size: 14px;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00ff41;
        }
        
        #status-content {
            margin-bottom: 15px;
        }
        
        .status {
            margin: 15px 0;
            padding: 10px;
            border-left: 3px solid #00ff41;
            padding-left: 15px;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .alert {
            color: #ff3333;
            border-left-color: #ff3333;
        }
        
        .success {
            color: #00ff41;
            border-left-color: #00ff41;
        }
        
        .console-output {
            background: #000;
            border: 1px solid #00ff41;
            padding: 10px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.4;
        }
        
        .console-output div {
            margin: 2px 0;
        }
        
        .log-info {
            color: #00ff41;
        }
        
        .log-error {
            color: #ff3333;
        }
        
        .log-warn {
            color: #ffaa00;
        }
        
        .controls-panel {
            border: 2px solid #00ff41;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            max-height: 500px;
            pointer-events: auto;
            overflow-y: auto;
        }
        
        .controls-panel h2 {
            font-size: 14px;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00ff41;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: rgba(0, 255, 65, 0.2);
            border: 1px solid #00ff41;
            color: #00ff41;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: rgba(0, 255, 65, 0.4);
            text-shadow: 0 0 5px #00ff41;
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
            }
            
            .panel, .controls-panel {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Google Maps Container (Full Screen) -->
    <div id="map"></div>
    
    <!-- Aegis UI Overlay -->
    <div id="app">
        <h1>⚡ Aegis Legacy Protocol - Truth Engine</h1>
        
        <div class="container">
            <!-- Status Panel -->
            <div class="panel">
                <h2>System Status</h2>
                <div id="status-content">
                    <div class="status">
                        <strong>🔄 Initializing Reality Verification System...</strong>
                    </div>
                </div>
                <div class="console-output" id="console-output"></div>
            </div>
            
            <!-- Controls Panel -->
            <div class="controls-panel">
                <h2>Map Controls</h2>
                <div class="control-group">
                    <label>View Mode:</label>
                    <button id="btn-satellite">Satellite View</button>
                    <button id="btn-roadmap">Roadmap View</button>
                    <button id="btn-terrain">Terrain View</button>
                </div>
                <div class="control-group">
                    <label>Street View:</label>
                    <button id="btn-streetview">Activate Street View</button>
                </div>
                <div class="control-group">
                    <label>Zoom Control:</label>
                    <button id="btn-zoom-in">Zoom In</button>
                    <button id="btn-zoom-out">Zoom Out</button>
                </div>
                <div class="control-group">
                    <label>Location:</label>
                    <button id="btn-center-mother-lode">Center on Mother Lode</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Google Maps API Script -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=__NEXT_PUBLIC_GOOGLE_MAPS_API_KEY__&callback=initMap"></script>
    
    <!-- Aegis Protocol Scripts -->
    <script src="proof-of-reality.js" defer></script>
    <script src="ai-integration.js" defer></script>
    
    <!-- Google Maps Initialization & Aegis Integration -->
    <script defer>
        // Logger utility
        const AegisLogger = {
            logs: [],
            
            log: function(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                this.logs.push({ message: logEntry, type });
                this.render();
                console.log(logEntry);
            },
            
            render: function() {
                const output = document.getElementById('console-output');
                if (output) {
                    output.innerHTML = this.logs
                        .map(log => `<div class="log-${log.type}">${log.message}</div>`)
                        .join('');
                    output.scrollTop = output.scrollHeight;
                }
            }
        };
        
        // Google Maps Instance
        const AegisMap = {
            map: null,
            streetViewPanorama: null,
            initialized: false,
            
            // Mother Lode coordinates (Jamestown/Sonora area)
            motherLodeLocation: { lat: 37.8616, lng: -120.4486 },
            currentZoom: 14,
            
            init: function() {
                try {
                    AegisLogger.log('Initializing Google Maps Engine...', 'info');
                    
                    // Create map instance
                    this.map = new google.maps.Map(document.getElementById('map'), {
                        zoom: this.currentZoom,
                        center: this.motherLodeLocation,
                        mapTypeId: google.maps.MapTypeId.SATELLITE,
                        fullscreenControl: true,
                        fullscreenControlOptions: {
                            position: google.maps.ControlPosition.TOP_RIGHT
                        },
                        zoomControl: true,
                        mapTypeControl: true,
                        streetViewControl: true,
                        rotateControl: true,
                        scaleControl: true
                    });
                    
                    AegisLogger.log('Google Maps Initialized - Satellite View Active', 'info');
                    AegisLogger.log(`📍 Location: Mother Lode Region (${this.motherLodeLocation.lat}, ${this.motherLodeLocation.lng})`, 'info');
                    
                    // Bind control buttons
                    this.bindControls();
                    
                    this.initialized = true;
                    AegisLogger.log('Map Engine Ready', 'success');
                    
                } catch (error) {
                    AegisLogger.log(`Map Initialization Error: ${error.message}`, 'error');
                }
            },
            
            bindControls: function() {
                // View mode buttons
                document.getElementById('btn-satellite').addEventListener('click', () => {
                    this.map.setMapTypeId(google.maps.MapTypeId.SATELLITE);
                    AegisLogger.log('View Mode: SATELLITE', 'info');
                });
                
                document.getElementById('btn-roadmap').addEventListener('click', () => {
                    this.map.setMapTypeId(google.maps.MapTypeId.ROADMAP);
                    AegisLogger.log('View Mode: ROADMAP', 'info');
                });
                
                document.getElementById('btn-terrain').addEventListener('click', () => {
                    this.map.setMapTypeId(google.maps.MapTypeId.TERRAIN);
                    AegisLogger.log('View Mode: TERRAIN', 'info');
                });
                
                // Zoom controls
                document.getElementById('btn-zoom-in').addEventListener('click', () => {
                    this.currentZoom++;
                    this.map.setZoom(this.currentZoom);
                    AegisLogger.log(`Zoom Level: ${this.currentZoom}`, 'info');
                });
                
                document.getElementById('btn-zoom-out').addEventListener('click', () => {
                    this.currentZoom--;
                    this.map.setZoom(this.currentZoom);
                    AegisLogger.log(`Zoom Level: ${this.currentZoom}`, 'info');
                });
                
                // Center on Mother Lode
                document.getElementById('btn-center-mother-lode').addEventListener('click', () => {
                    this.map.panTo(this.motherLodeLocation);
                    this.map.setZoom(14);
                    this.currentZoom = 14;
                    AegisLogger.log('Centered on Mother Lode Region', 'info');
                });
                
                // Street View
                document.getElementById('btn-streetview').addEventListener('click', () => {
                    this.activateStreetView();
                });
            },
            
            activateStreetView: function() {
                AegisLogger.log('Activating Street View...', 'info');
                
                const container = document.createElement('div');
                container.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    z-index: 100;
                    background: #000;
                `;
                
                const closeBtn = document.createElement('button');
                closeBtn.textContent = '✕ Close Street View';
                closeBtn.style.cssText = `
                    position: absolute;
                    top: 20px;
                    right: 20px;
                    z-index: 101;
                    padding: 10px 20px;
                    background: rgba(0, 255, 65, 0.2);
                    border: 2px solid #00ff41;
                    color: #00ff41;
                    cursor: pointer;
                    font-family: 'Courier New', monospace;
                    font-size: 12px;
                `;
                
                container.appendChild(closeBtn);
                document.body.appendChild(container);
                
                this.streetViewPanorama = new google.maps.StreetViewPanorama(
                    container,
                    {
                        position: this.motherLodeLocation,
                        pov: { heading: 0, pitch: 0 },
                        zoom: 1
                    }
                );
                
                AegisLogger.log('Street View Active - Mother Lode Region', 'success');
                
                closeBtn.addEventListener('click', () => {
                    container.remove();
                    this.streetViewPanorama = null;
                    AegisLogger.log('Street View Closed', 'info');
                });
            }
        };
        
        // Global initMap function (required by Google Maps callback)
        window.initMap = function() {
            AegisMap.init();
        };
        
        // Main Initialization Function
        function initializeAegis() {
            try {
                AegisLogger.log('=== Aegis Legacy Protocol Startup ===', 'info');
                AegisLogger.log('System Initializing...', 'info');
                
                // Initialize Map
                if (typeof google !== 'undefined' && google.maps) {
                    AegisMap.init();
                } else {
                    AegisLogger.log('Waiting for Google Maps API...', 'warn');
                    setTimeout(initializeAegis, 500);
                    return;
                }
                
                // Run Truth Engine
                setTimeout(() => {
                    if (typeof aegisProtocol !== 'undefined') {
                        AegisLogger.log('Truth Engine Online', 'info');
                        const result = aegisProtocol.verifyReality({ source: "Live Feed", isTampered: false });
                        AegisLogger.log(result, 'info');
                        
                        // Update Status Panel
                        const statusContent = document.getElementById('status-content');
                        if (statusContent) {
                            statusContent.innerHTML = `
                                <div class="status success">
                                    <strong>✓ Reality Verification Complete</strong><br>
                                    Status: Data Authenticity Confirmed<br>
                                    Protocol: Aegis Legacy ${new Date().toLocaleTimeString()}
                                </div>
                            `;
                        }
                    }
                }, 500);
                
                // Log AI Integration
                setTimeout(() => {
                    if (typeof aegisAI !== 'undefined') {
                        AegisLogger.log(`AI Integration Ready: ${aegisAI.model}`, 'info');
                    }
                }, 700);
                
                // Log Agents
                setTimeout(() => {
                    AegisLogger.log('Agent Status:', 'info');
                    if (typeof aegisProtocol !== 'undefined') {
                        AegisLogger.log(`  • Vigil: ${aegisProtocol.agents.vigil}`, 'warn');
                        AegisLogger.log(`  • Validator: ${aegisProtocol.agents.validator}`, 'warn');
                        AegisLogger.log(`  • Executive: ${aegisProtocol.agents.executive}`, 'warn');
                    }
                }, 900);
                
                AegisLogger.log('=== Startup Complete ===', 'info');
                
            } catch (error) {
                AegisLogger.log(`Initialization Error: ${error.message}`, 'error');
            }
        }
        
        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeAegis);
        } else {
            initializeAegis();
        }
    </script>
</body>
</html>
